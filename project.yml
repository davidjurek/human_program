name: HumanProgram
options:
  bundleIdPrefix: app.humanprogram
  deploymentTarget:
    iOS: "17.6"
  xcodeVersion: "15.4"
  createIntermediateGroups: true

packages:
  DSKit:
    url: https://github.com/imodeveloper/dskit-swiftui.git
    from: "1.1.2"

settings:
  SWIFT_VERSION: "5.9"
  IPHONEOS_DEPLOYMENT_TARGET: "17.6"
  MARKETING_VERSION: "1.0.0"
  CURRENT_PROJECT_VERSION: "1"
  PRODUCT_BUNDLE_IDENTIFIER: app.humanprogram.ios
  # Code signing for running on a real device (David Ko's free Personal Team).
  DEVELOPMENT_TEAM: 8WW85L69P3
  CODE_SIGN_STYLE: Automatic

targets:
  HumanProgram:
    type: application
    platform: iOS
    sources:
      - path: HumanProgram
    dependencies:
      - package: DSKit
        product: DSKit
    resources:
      - path: HumanProgram/Resources
    info:
      path: HumanProgram/Resources/Info.plist
      properties:
        CFBundleDisplayName: Human Program
        CFBundleName: HumanProgram
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchStoryboardName: ""
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        NSCalendarsUsageDescription: "Human Program uses your calendars to show events in Today."
        NSUserNotificationUsageDescription: "Human Program uses notifications to fire your reminders."
        NSFaceIDUsageDescription: "Human Program uses Face ID to protect your planner."
        UIBackgroundModes: []
        UIAppFonts:
          - Cardo-Regular.ttf
          - Cardo-Bold.ttf
          - LibertinusSerif-Regular.ttf
          - LibertinusSerif-Bold.ttf
          - MartelSans-Regular.ttf
          - MartelSans-Bold.ttf
          - Lilex.ttf
          - BitcountGridSingle.ttf
        # Declare .hprgm as an app-owned file type so iOS recognises it and keeps
        # the extension when a backup is exported / saved to Files, and so the app
        # can open .hprgm files.
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: app.humanprogram.ios.hprgm
            UTTypeDescription: Human Program Backup
            UTTypeConformsTo:
              - public.data
            UTTypeTagSpecification:
              public.filename-extension:
                - hprgm
        CFBundleDocumentTypes:
          - CFBundleTypeName: Human Program Backup
            LSHandlerRank: Owner
            LSItemContentTypes:
              - app.humanprogram.ios.hprgm
    settings:
      INFOPLIST_FILE: HumanProgram/Resources/Info.plist
      PRODUCT_NAME: HumanProgram
      # App icon + selectable alternates (penguin is the default/primary).
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES:
        - AppIconDuck
        - AppIconFennec
      ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: YES

  HumanProgramTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: HumanProgramTests
    dependencies:
      - target: HumanProgram
    # Host-based unit tests: the bundle loads its symbols (and DSKit + its
    # transitive modules) from the HumanProgram app. Without a host, the bundle
    # tried to statically link an application target and failed to resolve both
    # DSKit's SDWebImage and the app's own model symbols.
    settings:
      GENERATE_INFOPLIST_FILE: YES

schemes:
  HumanProgram:
    build:
      targets:
        HumanProgram: all
        HumanProgramTests: [test]
    test:
      targets:
        - HumanProgramTests
